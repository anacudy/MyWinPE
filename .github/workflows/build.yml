on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install ADK
        run: script\InstallADK.ps1

      - name: Test
        run: ls "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit"

      - name: Copype
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          call copype amd64 %CD%\WinPE

      - name: MakeWinPEMedia
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          call MakeWinPEMedia /ISO %CD%\WinPE %CD%\WinPE.iso /bootex

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: "*.log"
