on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install ADK
        run: script\InstallADK.ps1

      - name: Prepare
        run: script\Prepare.ps1

      - name: Copype
        shell: cmd
        run: script\xxx.cmd

      # - name: Get Hash
      #   run: script\GetHash.ps1

      - name: Compress
        run: 7z a -mx DISM.7z C:\Windows\Logs\DISM

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: |
            WinPE.iso
            DISM.7z
