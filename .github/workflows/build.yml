on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install ADK
        run: script\InstallADK.ps1

      - name: Copype
        shell: cmd
        run: script\xxx.cmd

      # - name: Test
      #   run: |
      #     ls WinPE
      #     ls WinPE\media

      # - name: MakeWinPEMedia
      #   shell: cmd
      #   run: |
      #     set WinPE=%CD%\WinPE
      #     call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
      #     MakeWinPEMedia /ISO %WinPE% %WinPE%.iso /bootex

      - name: Get Hash
        run: script\GetHash.ps1

      - name: Compress
        run: 7z a -mx WinPE.7z WinPE.iso

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: WinPE.7z
          body_path: WinPE.md5
